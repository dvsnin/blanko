version: "3.9"

services:
  traefik:
    image: traefik:v3.1
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      default:
        aliases:
          - app.localhost
          - keycloak.localhost

  postgres_backend:
    image: postgres:17
    environment:
      POSTGRES_USER: ${APP_POSTGRES_USER}
      POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD}
      POSTGRES_DB: ${APP_POSTGRES_DB}
    volumes:
      - pgdata_backend:/var/lib/postgresql/data
    ports:
      - "${APP_POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${KC_POSTGRES_USER}
      POSTGRES_PASSWORD: ${KC_POSTGRES_PASSWORD}
      POSTGRES_DB: ${KC_POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.5
    command:
      - start-dev
      - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KC_POSTGRES_DB}
      KC_DB_USERNAME: ${KC_POSTGRES_USER}
      KC_DB_PASSWORD: ${KC_POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      KC_HOSTNAME: keycloak.localhost
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY: edge
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    depends_on:
      - postgres
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`keycloak.localhost`)"
      - "traefik.http.routers.keycloak.entrypoints=web"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    restart: on-failure
    depends_on:
      keycloak:
        condition: service_started
        restart: true
      backend:
        condition: service_started
    command:
      - --http-address=0.0.0.0:4180

      # OIDC / Keycloak
      - --provider=oidc
      - --oidc-issuer-url=http://keycloak.localhost/realms/blanko
      - --client-id=blanko
      - --client-secret=${OIDC_CLIENT_SECRET}
      - --scope=openid profile email
      - --email-domain=*
      - --insecure-oidc-allow-unverified-email=true

      # куда редиректить после логина
      - --redirect-url=http://app.localhost/oauth2/callback

      # upstream = твой backend
      - --upstream=http://backend:8080/

      # куки и режим за прокси
      - --cookie-secret=${OAUTH2_PROXY_COOKIE_SECRET}
      - --cookie-secure=false
      # cookie_refresh должен быть МЕНЬШЕ access_token lifespan в Keycloak (сейчас 15m),
      # чтобы oauth2-proxy успевал проактивно рефрешить access_token по refresh_token.
      - --cookie-refresh=4m
      # общий срок жизни сессионной куки (refresh_token). В Keycloak SSO idle = 30 дней.
      - --cookie-expire=720h
      - --skip-jwt-bearer-tokens=true
      - --reverse-proxy=true
      - --skip-provider-button=true

      # разрешаем редирект на Keycloak после /oauth2/sign_out?rd=...
      - --whitelist-domain=keycloak.localhost

      # прокидываем заголовки в backend
      - --pass-user-headers=true
      # прокидываем id_token в Authorization: Bearer <id_token>,
      # нужен backend'у для id_token_hint при RP-initiated logout (Keycloak пропустит confirm)
      - --pass-authorization-header=true
      #- --pass-access-token=true

    labels:
      - "traefik.enable=true"
      # весь трафик на app.localhost идёт в oauth2-proxy
      - "traefik.http.routers.app.rule=Host(`app.localhost`)"
      - "traefik.http.routers.app.entrypoints=web"
      - "traefik.http.services.app.loadbalancer.server.port=4180"
      - "traefik.http.routers.app.middlewares=strip-gap-auth"
      - "traefik.http.middlewares.strip-gap-auth.headers.customResponseHeaders.Gap-Auth="

  backend:
    build: ../backend/app
    environment:
      REDIS_ADDR: redis:6379
      POSTGRES_DSN: postgres://${APP_POSTGRES_USER}:${APP_POSTGRES_PASSWORD}@postgres_backend:5432/${APP_POSTGRES_DB}?sslmode=disable
      TLDRAW_LICENSE_KEY: ${TLDRAW_LICENSE_KEY}
    depends_on:
      redis:
        condition: service_started
      postgres_backend:
        condition: service_healthy

  redis:
    image: redis:7.2
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
  pgdata_backend:
