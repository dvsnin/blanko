services:
  traefik:
    image: traefik:v3.1
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"

  # Один Postgres на стенд: база приложения, база Keycloak и app_test. Роль и базы, кроме основной,
  # создаёт deploy/postgres/init.sh при первом старте на пустом томе.
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${APP_POSTGRES_USER}
      POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD}
      POSTGRES_DB: ${APP_POSTGRES_DB}
      KC_POSTGRES_USER: ${KC_POSTGRES_USER}
      KC_POSTGRES_PASSWORD: ${KC_POSTGRES_PASSWORD}
      KC_POSTGRES_DB: ${KC_POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports:
      - "${APP_POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.5
    command:
      - start-dev
      - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KC_POSTGRES_DB}
      KC_DB_USERNAME: ${KC_POSTGRES_USER}
      KC_DB_PASSWORD: ${KC_POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      # Keycloak публикуется напрямую на localhost:8081, минуя Traefik. Issuer токенов фиксирован этим
      # адресом, а backchannel из сети compose (oauth2-proxy -> keycloak:8080) разрешён отдельно.
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import
      - ./keycloak/themes/blanko:/opt/keycloak/themes/blanko
    depends_on:
      postgres:
        condition: service_healthy

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    restart: on-failure
    depends_on:
      keycloak:
        condition: service_started
        restart: true
      backend:
        condition: service_started
    command:
      - --http-address=0.0.0.0:4180

      # OIDC / Keycloak. Браузер ходит в Keycloak на localhost:8081, oauth2-proxy внутри сети compose
      # на keycloak:8080, поэтому discovery выключен и адреса заданы явно; issuer проверяется по публичному.
      - --provider=oidc
      - --oidc-issuer-url=http://localhost:8081/realms/blanko
      - --skip-oidc-discovery=true
      - --login-url=http://localhost:8081/realms/blanko/protocol/openid-connect/auth
      - --redeem-url=http://keycloak:8080/realms/blanko/protocol/openid-connect/token
      - --oidc-jwks-url=http://keycloak:8080/realms/blanko/protocol/openid-connect/certs
      - --client-id=blanko
      - --client-secret=${OIDC_CLIENT_SECRET}
      - --scope=openid profile email
      - --email-domain=*
      - --insecure-oidc-allow-unverified-email=true

      - --redirect-url=http://localhost/oauth2/callback

      - --upstream=http://backend:8080/

      - --cookie-secret=${OAUTH2_PROXY_COOKIE_SECRET}
      - --cookie-secure=false
      # cookie_refresh должен быть МЕНЬШЕ access_token lifespan в Keycloak (сейчас 15m),
      # чтобы oauth2-proxy успевал проактивно рефрешить access_token по refresh_token.
      - --cookie-refresh=4m
      # общий срок жизни сессионной куки (refresh_token). В Keycloak SSO idle = 30 дней.
      - --cookie-expire=720h
      - --skip-jwt-bearer-tokens=true
      - --reverse-proxy=true
      - --skip-provider-button=true

      # разрешаем редирект на Keycloak после /oauth2/sign_out?rd=...
      - --whitelist-domain=localhost:8081

      # Экран показа работает без входа: страница, вебсокет и медиа по токену, статика холста и шрифты.
      - --skip-auth-route=^/app/present/
      - --skip-auth-route=^/app/static/

      - --pass-user-headers=true
      # id_token в Authorization: бэкенду для id_token_hint при выходе из Keycloak
      - --pass-authorization-header=true

    labels:
      - "traefik.enable=true"
      # весь трафик на :80 идёт в oauth2-proxy, каким бы именем ни назвали хост (localhost, IP, имя в сети сада)
      - "traefik.http.routers.app.rule=PathPrefix(`/`)"
      - "traefik.http.routers.app.entrypoints=web"
      - "traefik.http.services.app.loadbalancer.server.port=4180"
      - "traefik.http.routers.app.middlewares=strip-gap-auth"
      - "traefik.http.middlewares.strip-gap-auth.headers.customResponseHeaders.Gap-Auth="

  backend:
    build: ../backend/app
    # Docker по умолчанию убивает контейнер через 10 с, комнатам нужно время на сброс в хранилище.
    stop_grace_period: 30s
    environment:
      POSTGRES_DSN: postgres://${APP_POSTGRES_USER}:${APP_POSTGRES_PASSWORD}@postgres:5432/${APP_POSTGRES_DB}?sslmode=disable
      TLDRAW_LICENSE_KEY: ${TLDRAW_LICENSE_KEY}
      ORG_NAME: ${APP_ORG_NAME}
      ADMIN_EMAILS: ${APP_ADMIN_EMAILS}
      KEYCLOAK_PUBLIC_URL: http://localhost:8081
      # Однократно: APP_PRESET_RESEED=1 make up SKIP_FRONTEND=1 перегенерирует документы готовых шаблонов.
      PRESET_RESEED: ${APP_PRESET_RESEED:-}
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: ${APP_S3_ACCESS_KEY}
      S3_SECRET_KEY: ${APP_S3_SECRET_KEY}
      S3_BUCKET: ${APP_S3_BUCKET}
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  # S3-совместимое хранилище содержимого досок и медиа. Наружу не публикуется.
  rustfs:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: ${APP_S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${APP_S3_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    volumes:
      - rustfsdata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:9000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  pgdata:
  rustfsdata:
