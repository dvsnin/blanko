<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
    <title>%%PAGE_TITLE%%</title>
    <link rel="icon" type="image/svg+xml" href="/app/static/icons/favicon.svg"/>
    <link rel="icon" type="image/png" sizes="32x32" href="/app/static/icons/favicon-32.png"/>
    <link rel="apple-touch-icon" href="/app/static/icons/apple-touch-icon.png"/>

    <link rel="stylesheet" href="/app/static/fonts/nunito.css"/>

    <!-- tldraw styles: инструменты, стили нод/стикеров/курсора и т.д. -->
    <link rel="stylesheet" href="/app/static/canvas/assets/canvas.css"/>

    <style>
        html, body { height: 100%; margin: 0; font-family: "Nunito", "Segoe UI", system-ui, sans-serif; }
        body { background: #f3f6f9; overflow: hidden; }

        /* Шапка повторяет геометрию и токены Topbar.css кабинета (69px с рамкой, отступ 32px, логотип 36px),
           чтобы переход доска <-> кабинет в той же вкладке не дёргал страницу. */
        .topbar { box-sizing: border-box; height: 69px; background: #FFFFFF; border-bottom: 1px solid #E6E2D9; display: flex; align-items: center; justify-content: space-between; padding: 12px 32px; z-index: 2000; position: relative; } /* выше панелей tldraw, чтобы список участников не перекрывался */
        .brand-row { display: flex; align-items: center; gap: 12px; }
        /* Выход в кабинет хлебными крошками: логотип и раздел ведут назад в той же вкладке */
        .back-link { display: inline-flex; align-items: center; gap: 10px; color: #5B6472; font-size: 14px; font-weight: 700; text-decoration: none; padding: 0 10px 0 0; border-radius: 10px; transition: background .15s, color .15s; }
        .back-link:hover { background: #ECE9E0; color: #22262E; }
        .back-link .logo { width: 36px; height: 36px; border-radius: 10px; background: #ECE9E0; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
        .crumb-sep { color: #C9C4B8; font-size: 16px; font-weight: 400; }
        .board-meta { display: flex; align-items: center; gap: 18px; }
        .board-name { font-size: 20px; font-weight: 800; color: #22262E; line-height: 1; }
        .save-state { font-size: 13px; font-weight: 600; color: #5B6472; }

        .top-actions { display: flex; gap: 10px; align-items: center; }
        .share-hint { font-size: 13px; color: #64748b; opacity: 0; transition: opacity .2s; }
        .share-hint.is-visible { opacity: 1; }
        /* Кнопки как в кабинете (.btn--ghost и .btn--soft из app.css): 44px, скругление 12px, без градиентов. */
        .btn { box-sizing: border-box; height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid #E6E2D9; background: #FFFFFF; color: #22262E; font: inherit; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; white-space: nowrap; transition: background 150ms ease, border-color 150ms ease; }
        .btn:hover { background: #ECE9E0; }
        .btn:focus-visible { outline: 2px solid #1F8A85; outline-offset: 2px; }
        .btn.primary { background: #E6F4F3; border-color: transparent; color: #1F8A85; }
        .btn.primary:hover { background: #D6ECEA; }

        /* Участники комнаты: в шапке кнопка со своим кружком и числом подключений, по клику список.
           Цвета те же, что у курсоров на холсте. */
        .people { position: relative; display: inline-flex; align-items: center; }
        .people__trigger { box-sizing: border-box; height: 44px; padding: 0 12px 0 4px; border-radius: 12px; border: 1px solid #E6E2D9; background: #FFFFFF; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font: inherit; font-size: 14px; font-weight: 700; color: #22262E; transition: background 150ms ease; }
        .people__trigger:hover, .people__trigger[aria-expanded="true"] { background: #ECE9E0; }
        .people__trigger:focus-visible { outline: 2px solid #1F8A85; outline-offset: 2px; }
        .people__avatar { width: 34px; height: 34px; border-radius: 50%; flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; color: #FFFFFF; text-shadow: 0 1px 1px rgba(0,0,0,0.25); }
        .people__count { min-width: 20px; text-align: center; }
        .people__pop { position: absolute; top: calc(100% + 8px); right: 0; width: 320px; max-height: 420px; overflow: auto; background: #FFFFFF; border: 1px solid #E6E2D9; border-radius: 14px; box-shadow: 0 16px 40px rgba(34, 38, 46, 0.14); padding: 8px; z-index: 50; }
        .people__title { margin: 4px 8px 8px; font-size: 13px; font-weight: 700; color: #5B6472; }
        .people__row { width: 100%; display: flex; align-items: center; gap: 10px; padding: 6px 8px; border: 0; border-radius: 10px; background: transparent; text-align: left; font: inherit; color: #22262E; cursor: pointer; }
        .people__row:hover { background: #F6F4EE; }
        .people__row[disabled] { cursor: default; }
        .people__row[disabled]:hover { background: transparent; }
        .people__row--following { background: #E6F4F3; }
        .people__row--following:hover { background: #D6ECEA; }
        .people__who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
        .people__name { font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .people__meta { font-size: 12px; font-weight: 600; color: #5B6472; }
        .people__row--away .people__avatar { opacity: 0.5; }
        .people__follow { font-size: 12px; font-weight: 700; color: #1F8A85; white-space: nowrap; }

        #tldraw-root { position: absolute; left: 0; right: 0; top: 69px; bottom: 0; }
        @media (max-width: 720px) { .topbar { padding: 12px 16px; } }

        /* Оверлей поверх холста: загрузка, потеря связи, удалённый документ. Пока виден, холст только для чтения. */
        .overlay { position: absolute; left: 0; right: 0; top: 69px; bottom: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: rgba(243,246,249,0.78); backdrop-filter: blur(3px); }
        .overlay[hidden] { display: none; }
        .overlay-card { background: #fff; border-radius: 16px; padding: 28px 32px; min-width: 280px; text-align: center; box-shadow: 0 18px 50px rgba(15,23,42,0.12); }
        .overlay-title { font-size: 18px; font-weight: 700; color: #0f1724; margin: 14px 0 6px; }
        .overlay-text { font-size: 14px; color: #64748b; min-height: 20px; }
        .overlay-retry { margin-top: 16px; }
        .overlay-retry[hidden] { display: none; }
        .spinner { width: 36px; height: 36px; margin: 0 auto; border-radius: 50%; border: 3px solid #e6e9f2; border-top-color: #4f8bff; animation: spin 0.9s linear infinite; }
        .spinner[hidden] { display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* tldraw sets its own font family via .tl-container - подхватываем Inter */
        .tl-container { font-family: Inter, system-ui, -apple-system, sans-serif; }

        /* Панель участников (share panel tldraw): аватары, клик - следовать за человеком */
        .people-panel { display: flex; gap: 6px; align-items: center; padding: 6px 8px; pointer-events: all; }
        .people-avatar { width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 13px; cursor: pointer; box-shadow: 0 2px 8px rgba(2,6,23,0.18); transition: transform 120ms ease, border-color 120ms ease; }
        .people-avatar:hover { transform: translateY(-1px); }
        .people-avatar.following { border-color: #0f1724; box-shadow: 0 0 0 2px #fff, 0 2px 8px rgba(2,6,23,0.25); }
    </style>
</head>
<body>


<div class="topbar">
    <div class="brand-row">
        <a class="back-link" id="backLink" href="/app/dashboard#/boards" aria-label="Вернуться в кабинет">
            <span class="logo"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="7.5" cy="7.5" r="4" fill="#F2B134"/><path d="M12.5 3.5h8v8h-8z" fill="#1F8A85"/><path d="M4 20.5l5.5-9 5.5 9z" fill="#D5512E"/></svg></span>
            <span id="backLabel">Доски</span>
        </a>
        <span class="crumb-sep" aria-hidden="true">/</span>
        <div class="board-meta">
            <div class="board-name" id="boardName">%%BOARD_TITLE%%</div>
            <span class="save-state" id="saveState">Загрузка</span>
        </div>
    </div>

    <div class="top-actions">
        <span class="share-hint" id="shareHint" role="status" aria-live="polite"></span>
        <button class="btn primary" id="shareBtn">Поделиться</button>
        <div class="people" id="people"></div>
    </div>
</div>

<div id="tldraw-root"></div>

<div class="overlay" id="overlay" role="status" aria-live="polite">
    <div class="overlay-card">
        <div class="spinner" id="overlaySpinner"></div>
        <div class="overlay-title" id="overlayTitle">Загружаем доску</div>
        <div class="overlay-text" id="overlayText">Подключаемся к серверу</div>
        <button type="button" class="btn overlay-retry" id="overlayRetry" hidden>Повторить сейчас</button>
    </div>
</div>

<!-- Логика холста в frontend/canvas/src/main.js, сборка кладёт её в assets/canvas.js. -->
<script type="module" src="/app/static/canvas/assets/canvas.js"></script>
</body>
</html>
